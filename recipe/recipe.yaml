schema_version: 1

context:
  version: "2.1.4"

package:
  name: opening-hours-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opening-hours-py/opening_hours_py-${{ version }}.tar.gz
  sha256: d81e43909b89aaaa8a946024540bbae523d028be5e81f789b88216e1ce44117a

build:
  number: 0
  script:
    - if: not win
      then: export PYO3_PYTHON="${{ PYTHON }}"
    - if: win
      then: set PYO3_PYTHON="${{ PYTHON }}"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - maturin build --release -i "${{ PYTHON }}"
    - ${{ PYTHON }} -m pip install opening-hours-py --no-index --find-links=target/wheels --no-deps -vv

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - python
    - poetry >=0.12
    - maturin >=1,<2
    - poetry-core
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - opening_hours
      pip_check: true

about:
  summary: A parser and toolkit for the opening_hours in OpenStreetMap written in Rust.
  license: MIT AND Apache-2.0
  license_file:
    - THIRDPARTY.yml
    - LICENSE-APACHE
    - LICENSE-MIT
    - opening-hours-py/LICENSE-APACHE
    - opening-hours-py/LICENSE-MIT
    - opening-hours-syntax/LICENSE-APACHE
    - opening-hours-syntax/LICENSE-MIT
  homepage: https://github.com/remi-dupre/opening-hours-rs/tree/master/opening-hours-py

extra:
  recipe-maintainers:
    - p-vdp
